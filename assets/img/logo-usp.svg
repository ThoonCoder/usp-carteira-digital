      <rect width="132" height="60" fill="#000"/>
      <g fill="none" stroke-linejoin="round">
        <path id="letras" d="M9 8 V35 Q9 51 24 51 Q38 51 38 35 V8 M76 12 H55 Q46 12 46 21 Q46 30 55 30 H65 Q74 30 74 40 Q74 50 64 50 H44 M86 52 V10 H107 Q122 10 122 23 Q122 36 107 36 H86" stroke="#fff" stroke-width="13" stroke-linecap="square"/>
