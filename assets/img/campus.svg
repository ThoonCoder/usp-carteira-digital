<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMax slice">
  <!-- Ilustração da Praça do Relógio (Cidade Universitária) -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d6f8a"/>
      <stop offset=".55" stop-color="#3fb0c9"/>
      <stop offset="1" stop-color="#a7e0e8"/>
    </linearGradient>
    <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8f3f"/>
      <stop offset="1" stop-color="#2f6630"/>
    </linearGradient>
    <linearGradient id="torre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d3c8"/>
      <stop offset=".6" stop-color="#bdb6a8"/>
      <stop offset="1" stop-color="#9c9586"/>
    </linearGradient>
    <pattern id="janelas" width="18" height="16" patternUnits="userSpaceOnUse">
      <rect width="18" height="16" fill="#f4f6f7"/>
      <rect x="3" y="4" width="12" height="7" fill="#7f97a8"/>
    </pattern>
    <g id="palmeira">
      <path d="M0 0 C2 -40 -2 -80 4 -120" stroke="#5b4a35" stroke-width="5" fill="none"/>
      <g fill="#2e6b34">
        <path d="M4 -120 C-20 -130 -40 -120 -52 -100 C-30 -114 -12 -116 4 -116Z"/>
        <path d="M4 -120 C28 -132 48 -122 58 -104 C36 -116 20 -117 4 -116Z"/>
        <path d="M4 -120 C-6 -146 -26 -152 -42 -146 C-20 -140 -6 -132 4 -118Z"/>
        <path d="M4 -120 C14 -148 34 -154 50 -146 C28 -140 14 -132 4 -118Z"/>
        <path d="M4 -122 C2 -146 8 -160 18 -166 C12 -150 10 -136 6 -120Z"/>
      </g>
    </g>
  </defs>

  <rect width="1440" height="420" fill="url(#ceu)"/>
  <g fill="#fff" opacity=".22">
    <ellipse cx="220" cy="80" rx="190" ry="26"/>
    <ellipse cx="560" cy="130" rx="260" ry="20"/>
    <ellipse cx="980" cy="70" rx="220" ry="24"/>
    <ellipse cx="1300" cy="150" rx="180" ry="18"/>
  </g>

  <!-- Prédio da Reitoria -->
  <g transform="translate(250 196)">
    <rect x="-6" y="-14" width="332" height="16" fill="#e9edef"/>
    <rect width="320" height="150" fill="url(#janelas)"/>
    <rect x="0" y="150" width="320" height="10" fill="#cfd6da"/>
    <rect x="140" y="-30" width="4" height="18" fill="#3b4b57"/>
    <rect x="170" y="-30" width="4" height="18" fill="#3b4b57"/>
  </g>

  <!-- Torre do Relógio -->
  <g transform="translate(1040 0)">
    <path d="M0 360 L8 40 L74 34 L80 360Z" fill="url(#torre)"/>
    <circle cx="42" cy="72" r="15" fill="#e9e5dc" stroke="#7d776b" stroke-width="2"/>
    <path d="M42 72 V62 M42 72 L50 76" stroke="#3c3a35" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="none" stroke="#8a8476" stroke-width="2.5" opacity=".9">
      <path d="M22 110 h30 v18 h-18 v16 h26"/>
      <path d="M18 170 q20 -14 40 0 q-10 16 -28 12"/>
      <path d="M26 214 h24 v24 h-24z M32 220 h12 v12"/>
      <path d="M20 262 l18 18 l18 -18"/>
      <path d="M24 300 h34 M30 312 h22"/>
    </g>
  </g>

  <!-- Gramado -->
  <path d="M0 340 Q360 318 720 334 T1440 330 V420 H0Z" fill="url(#grama)"/>
  <path d="M0 360 Q480 344 960 362 T1440 356 V420 H0Z" fill="#285a2a" opacity=".55"/>

  <!-- Palmeiras -->
  <use href="#palmeira" transform="translate(120 360) scale(1.1)"/>
  <use href="#palmeira" transform="translate(640 352) scale(.85)"/>
  <use href="#palmeira" transform="translate(860 360) scale(1.2)"/>
  <use href="#palmeira" transform="translate(1210 356) scale(.95)"/>
  <use href="#palmeira" transform="translate(1360 364) scale(1.15)"/>
  <g fill="#2a5c2c">
    <ellipse cx="560" cy="350" rx="70" ry="22"/>
    <ellipse cx="980" cy="350" rx="60" ry="18"/>
    <ellipse cx="40" cy="362" rx="80" ry="24"/>
  </g>
</svg>
